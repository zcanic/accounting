<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A962"/>
      <stop offset="50%" style="stop-color:#F4E5B2"/>
      <stop offset="100%" style="stop-color:#C9A962"/>
    </linearGradient>
  </defs>
  
  <!-- Scale base -->
  <rect x="45" y="75" width="10" height="20" fill="#6B635A"/>
  
  <!-- Scale pillar -->
  <rect x="47" y="30" width="6" height="45" fill="#A69F92"/>
  
  <!-- Balance beam -->
  <rect x="10" y="25" width="80" height="6" rx="2" fill="url(#gold)"/>
  
  <!-- Left pan chain -->
  <line x1="20" y1="31" x2="20" y2="45" stroke="#6B635A" stroke-width="2"/>
  
  <!-- Right pan chain -->
  <line x1="80" y1="31" x2="80" y2="45" stroke="#6B635A" stroke-width="2"/>
  
  <!-- Left pan -->
  <ellipse cx="20" cy="50" rx="15" ry="5" fill="#D4CFC4"/>
  
  <!-- Right pan -->
  <ellipse cx="80" cy="50" rx="15" ry="5" fill="#D4CFC4"/>
  
  <!-- Top ornament -->
  <circle cx="50" cy="22" r="5" fill="url(#gold)"/>
</svg>
